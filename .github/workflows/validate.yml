name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-validation:
    name: Complete validation (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv run scripts/validate.py

  powershell-installer:
    name: PowerShell installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install into an isolated home
        shell: pwsh
        run: |
          $installHome = Join-Path $env:RUNNER_TEMP "pollyanna-windows-home"
          & .\install.ps1 -Yes -InstallHome $installHome
          $expected = @(
            (Join-Path $installHome ".agents\skills\pollyanna\SKILL.md"),
            (Join-Path $installHome ".claude\skills\pollyanna\SKILL.md"),
            (Join-Path $installHome ".cursor\skills\pollyanna\SKILL.md"),
            (Join-Path $installHome ".kiro\skills\pollyanna\SKILL.md"),
            (Join-Path $installHome ".cline\skills\pollyanna\SKILL.md"),
            (Join-Path $installHome ".agents\skills\pollyanna\assets\POLLYANNA.md"),
            (Join-Path $installHome "pollyanna\docs\memory.md")
          )
          $missing = $expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) {
            throw "Installer did not create: $($missing -join ', ')"
          }
      - name: Exercise the remote bootstrap
        shell: pwsh
        run: py -3 scripts/bootstrap_smoke.py powershell --repo-root .

  bash-installer:
    name: Bash installer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install into an isolated home
        shell: bash
        run: |
          install_home="${RUNNER_TEMP}/pollyanna-macos-home"
          POLLYANNA_INSTALL_HOME="${install_home}" bash install.sh --yes
          test -f "${install_home}/.agents/skills/pollyanna/SKILL.md"
          test -f "${install_home}/.claude/skills/pollyanna/SKILL.md"
          test -f "${install_home}/.cursor/skills/pollyanna/SKILL.md"
          test -f "${install_home}/.kiro/skills/pollyanna/SKILL.md"
          test -f "${install_home}/.cline/skills/pollyanna/SKILL.md"
          test -f "${install_home}/.agents/skills/pollyanna/assets/POLLYANNA.md"
          test -f "${install_home}/pollyanna/docs/memory.md"
      - name: Exercise the remote bootstrap
        shell: bash
        run: python3 scripts/bootstrap_smoke.py bash --repo-root .
